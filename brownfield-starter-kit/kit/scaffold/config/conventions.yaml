# Custom framework conventions (tools/context/conventions.py). Built-in presets cover FastAPI, Flask, Spring
# (MVC, Feign, RestTemplate/WebClient, Kafka/RabbitMQ/JMS), JPA, JAX-RS, Micronaut, ASP.NET Core, EF Core, NestJS,
# Express, TypeORM, Go net/http / gin / echo / chi, Laravel and Symfony: `python tools/context/conventions.py --list`.
#
# Add a preset here when the codebase uses an in-house framework, then name it under `conventions:` in
# config/services.yaml, or give it a `detect` regex so `auto` picks it up. Rules are regular expressions over:
#   decorator        a function/method's own annotations (text without @ / #[ / [)
#   class_decorator  the annotations of the class that owns the method
#   source           the file text (call-style APIs); matches are attributed to the enclosing symbol
# Named groups: method, path, args (annotation arguments: the path is the first string, or path= / value=),
# prefix, topic, const (a constant whose string value is the topic), target, url, handler, class, table, key.
presets: {}
