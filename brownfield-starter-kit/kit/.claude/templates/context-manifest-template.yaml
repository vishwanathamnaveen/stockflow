# Context Manifest — schema reference. The real file is GENERATED by tools/context/manifest.py into
# artifacts/changes/<task-id>/context-manifest.yaml. Do not hand-write it; context-builder-agent may only append to
# unknowns, conflicts and builder_notes (rule 40).
# Values in <angle brackets> are placeholders; "..." marks lists or text the tool fills in.

task:
  id: CR-<yyyymmdd>-<slug>                   # ticket id or CR-<date>-<slug>
  objective: "verbatim task text"
  type: feature                              # feature | bug | refactor | config | change
  mode: execute                              # execute | analyze
  created: <yyyy-mm-dd>
  commit: <short-sha>                        # HEAD the evidence was taken from (null without git)

intake:                                      # what the tool extracted from the text
  identifiers: [<field_or_symbol>]
  apis: []
  query_params: []                           # `?x=` inputs: never identifiers
  new_query_params: []                       # not yet on the endpoint -> minor additive-contract unknown
  business_rules: []
  keywords: [<word>, ...]
  generic_terms_ignored: []
  service_scores: {<service-a>: 12, <service-b>: 3}

repositories: [<repository>]
revision: 0                                  # bumped by every scope-change request (manifest.py --amend)
scope_changes: []                            # [{revision, date, reason, added_seeds, from:{risk,workflow,files}, to:{...}}]
services:
  primary: <service-a>
  must_change: [<service-a>]                 # primary + services of explicit <service>:<symbol> seeds
  impacted: [<service-b>, <service-c>]
  execution_enabled: {<service-a>: true}     # per must-change service (brownfield.enabled_services)
  coverage:                                  # rule 40.12: 'not found' is not 'proven absent'
    scope: this repository + observed traces
    external_catalog: null                   # brownfield.external_catalog
    consumers_proven_complete: false
    note: consumers outside this repo or outside the observed traffic window are NOT ruled out

seeds:                                       # where the task lands in code (refined by the builder with --seed)
  source: explicit                           # explicit | lexical | semantic
  semantic_search: {ran: true, required: true, candidates: 3, note: null}   # ran: false -> rebuild (rule 40.1)
  semantic_candidates: [{service: <service-a>, symbol: <module.Entity>, score: 0.71, via: dense}]   # cross-check with explicit seeds
  symbols: [{symbol: <module.Entity>, file: <path/to/entity-file>, matched: "shape change on entity <Entity>"}]
  identifiers: []                            # exact fields/topics searched across all services
  local_identifiers: []                      # plain-word field matches, primary service only
  candidate_fields: []                       # fuzzy matches for the builder to confirm
  entities: [<Entity>]
  unresolved: [<new_field>]                  # new concepts -> unknowns

files: [<path/to/entity-file>]
supporting_files: [contracts/openapi/<service-a>.json, contracts/events.yaml, docs/business-rules.md]  # edit only if the plan says so
symbols: [<module.Entity>, <schemas.EntityCreate>]
apis: [{id: "<service-a>:POST /<resource>", operation_id: <operation-id>, via: <api.create_entity>,
        response_schema: <EntityOut>, request_schema: <EntityCreate>}]

dependencies:
  direct: [{symbol: <domain.create_entity>, file: ..., lines: <start>-<end>, why: "code graph: <domain.create_entity> calls <module.Entity>",
            graph_node: <graph-node-id>, line_coverage: 1.0}]   # graphify explain <graph_node> --graph ...
  transitive: [{symbol: <api.get_entity>, depth: 1, why: "references <EntityOut>"}]
  cross_service:                             # from the service graph
    - {service: <service-b>, channel: rest, via: "<service-a>:GET /<resource>/{id}", client: <Client.get_entity>,
       location: <path/to/client-file>:<line>, reaches: ["<service-b>:POST /<other-resource>"],
       evidence: [static, contract, runtime], runtime: {calls: 20, sample_trace: <trace-id>}}
    - {service: <service-b>, channel: event, via: <entity.updated>, handler: <on_entity_updated>, calls: [<domain.handler_logic>]}
  identifier_references: [{service: <service-b>, symbol: <domain.uses_field>, uses: [<field>]}]
  must_change_services: [{service: <service-c>, direct: [...], transitive: [...], apis: [...], publishes: [...], subscribers: [...]}]

events:
  publishes: [{topic: <entity.updated>, publisher: <domain.update_entity>, subscribers: [<service-b>], payload: {...}}]
  consumes: []

data:
  tables: [{table: <table>, model: <module.Entity>, database: <database>}]
  contract_schemas: [<EntityCreate>, <EntityOut>, <EntityUpdate>]
  event_payloads: [<entity.created>, <entity.updated>]
  migration_tooling: "<Flyway | Liquibase | Alembic | EF Core | Prisma | Rails | none (...)>"
  notes: ["..."]
  lineage:                                   # rule 40.13: field -> declaring schema/payload -> consumer -> reader
    - field: <field>
      origin: <service-a>
      flows_to:
        - {service: <service-c>, channel: "<service-a>:GET /<resource>/{id} (<EntityOut>)", reader: <domain.reader>, resolved: true}
        - {service: <service-b>, channel: "<service-a>:GET /<resource>/{id} (<EntityOut>)", reader: null, resolved: false}

rollout:                                     # rule 40.10: provider before consumer
  - {order: 1, service: <service-a>, files: [...], apis: [...], publishes: [...]}
  - {order: 2, service: <service-c>, files: [...], apis: [...], publishes: [...]}

tests:
  by_symbol: {<domain.update_entity>: [<path/to/test-file>::<test_name>]}
  regression_suites: {<service-a>: [...], <service-b>: [...]}
  static_test_refs: []
  e2e: [<path/to/e2e-test>]
  uncovered_symbols: []
  coverage_source: var/quality/<service-a>-coverage.json
  selection_basis: line coverage selects tests that executed the changed lines; it does not prove they assert the new behaviour
  change_specific_tests_required: true        # rule 40.6
  behavioural_check_targets: [<domain.create_entity>, <domain.update_entity>]
  test_cases:                                 # only when brownfield.test_cases is configured (QA repo / export)
    sources: [{path: ../<qa-repo>/testcases, format: zephyr-json, exists: true, cases: 41}]
    direct:                                   # covers a changed symbol, endpoint or field: review the assertions
      - {key: <CASE-KEY>, name: "...", file: ../<qa-repo>/testcases/<case>.json, tier: direct,
         via: ["covers API POST /<resource>", "covers <Class.method>"]}
    transitive: []                            # covers code depending on the change: regression run
    basis: "..."

knowledge:
  business_rules: [{id: BR-<nnn>, rule: "...", implemented_in: "<service-a> `<domain.update_entity>`"}]
  references: [{path: docs/<doc>.md, line: <line>, matched: [<entity.updated>], text: "..."}]
  documents: [{citation: "knowledge/<document>.pdf#p.1", score: 0.73, excerpt: "..."}]   # only when knowledge/ has files

retrieval:                             # tool facts: what was asked of each FAISS index and what came back (never edited)
  semantic_index:                      # {ran: false, note: ...} when not searched
    index: graphs/semantic
    model: BAAI/bge-small-en-v1.5
    documents: <n>
    query_prefix: "Represent this sentence for searching relevant passages: "
    queries: [{role: task, text: "..."}, {role: expansion, text: "..."}]
    search: {k: 10, types: [api, code, rule, topic], min_dense_score: 0.55, fusion: "dense + BM25, RRF k=60"}
    hits:                              # outcome: candidate | already a candidate | no linked code | dropped: below min_dense_score
      - {rank: 1, id: "code:<service-a>:...<function>", type: code, service: <service-a>, title: "...", dense: 0.68,
         bm25: 10.58, fused: 32.46, outcome: candidate, candidates: [<service-a>:<domain.function>]}
  knowledge_base:                      # {state: absent | unavailable | unreadable, reason} when not searched
    index: graphs/kb
    model: BAAI/bge-small-en-v1.5
    passages: <n>
    query_prefix: "..."
    queries: [{role: task, text: "..."}]
    search: {top_k: 5, min_dense_score: 0.60, fusion: "dense + BM25, RRF k=60"}
    hits:                              # citations and scores only, never passage text; outcome: recorded | dropped: below min_dense_score
      - {rank: 1, citation: "knowledge/<document>.pdf#p.1", dense: 0.73, bm25: 4.1, fused: 32.8, outcome: recorded}
    dropped_not_listed: 0              # further passages below the floor (only the top_k near misses are listed)

config:
  flags: []                            # from config/flags.json when the repo has a flag registry
  env_vars: []
  subscriptions: {<entity.updated>: [<service-b>]}
  service_registry: {<service-a>: {port: <port>, owner: <team>}}

history: [{file: <path/to/file>, commits: 3, recent: [{commit: <sha>, date: <yyyy-mm-dd>, subject: "..."}], uncommitted_changes: false}]
runtime_evidence: [{edge: "<service-b> -> <service-a>:GET /<resource>/{id}", calls: 20, sample_trace: <trace-id>}]
memory: [{task_id: CR-..., objective: "...", outcome: success, lessons: "..."}]
freshness: {code_graph: fresh, built_at_commit: <sha>, stale_files: [], service_graph_commit: <sha>,
            build_config: {context_engine_version: 2, embedding_model: BAAI/bge-small-en-v1.5, transitive_depth: 3,
                           knowledge_exclude: [...]}}   # rule 40.14: other version/config = stale

unknowns: [{id: U-1, severity: major, text: "..."}]         # blocking | major | minor
conflicts: [{text: "README says 3 retries, config says 1", sources: [README.md, <path/to/config-file>]}]

confidence:
  overall: 0.77
  components: {intent_resolution: 0.66, graph_freshness: 1.0, test_evidence: 0.97, dependency_clarity: 0.75,
               knowledge_grounding: 1.0, unknowns: 0.6}
  critical_gaps: []                          # rule 40.2: [{dimension, score, floor}] -> overall capped at 0.60
  weights: {intent_resolution: 0.25, graph_freshness: 0.10, test_evidence: 0.20, dependency_clarity: 0.15,
            knowledge_grounding: 0.10, unknowns: 0.20}

risk:
  level: high                                # low | medium | high | critical
  score: 10
  factors: ["public contract schema touched: ...", "3 other service(s) depend on the affected code: ..."]
  mandatory_gates:                           # rule 40.5: floors no score can buy past
    - {gate: public_contract_change, floor: plan-approve-execute, reason: "public contract/event payload touched: ..."}

workflow:
  selected: guarded                          # analyze-only | clarify | fast-track | plan-approve-execute | guarded
  reason: "risk high (score 10)"
  human_gates: ["human approves change-plan.md before implementation", "service-owner sign-off for: ...", ...]
  required_checks:                           # pass/fail commands only; change-agent runs them (new tests: tests.*)
    - python scripts/run_tests.py <service-a> <service-b> <service-c>
    - <brownfield.checks.contracts>                         # when APIs are touched and a contract check is configured
    - python tools/context/refresh.py --check              # graphs + index match the final code
    - python tools/context/manifest.py --verify-scope CR-…  # change stayed inside the approved scope

# appended by context-builder-agent (never generated)
builder_notes:
  run_history: [{run: 1, args: "discovery", result: "noisy seeds"}, {run: 2, args: "--seed <module.Entity> ...", result: final}]
  seed_decisions: [{seed: <api.unrelated_function>, decision: dropped, reason: "matched a shared word only", source: ...}]
  change_nature: additive                    # additive | behavioural | breaking
  consumer_effects: [{service: <service-b>, channel: "rest GET /<resource>/{id}", effect: none, evidence: "<client-file>:<line> reads dict"}]
  assumptions: [{id: ASSUMPTION-1, statement: "...", status: pending}]   # pending -> plan Status: Pending Approval
  files_outside_manifest: []                 # files the change needs that the tool did not list (-> re-seed)
  extra_required_checks: []                  # appended to workflow.required_checks by change-agent
  risk_escalations: [{from: high, to: critical, reason: "..."}]
  final_workflow: {selected: guarded, reason: "...", confidence: 0.77, risk: high}   # effective = stricter of this and workflow.selected
